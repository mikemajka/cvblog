    <style>
        :root {
            --accent: #3a46d4;
            --accent-soft: rgba(58, 70, 212, 0.08);
            --ink: #1f2330;
            --muted: #6b7080;
            --line: #e3e5ee;
            --card: #ffffff;
        }

        /* No headshot: give the About section normal breathing room */
        #about { padding-top: 4rem; }

        /* Quick stats strip under the intro */
        .stats { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0 0.5rem; }
        .stat {
            flex: 1 1 140px; background: var(--card); border: 1px solid var(--line);
            border-radius: 10px; padding: 0.9rem 1.1rem;
        }
        .stat b { display: block; font-size: 1.5rem; color: var(--accent); line-height: 1.2; }
        .stat span { font-size: 0.85rem; color: var(--muted); }

        /* Timeline */
        .timeline { position: relative; margin: 1.5rem 0 0; padding-left: 1.75rem; }
        .timeline::before {
            content: ""; position: absolute; left: 0.4rem; top: 0.4rem; bottom: 0.4rem;
            width: 2px; background: var(--line);
        }
        .xp { position: relative; margin-bottom: 2rem; }
        .xp::before {
            content: ""; position: absolute; left: -1.75rem; top: 1.45rem;
            width: 0.95rem; height: 0.95rem; border-radius: 50%;
            background: var(--card); border: 3px solid var(--accent);
        }
        .xp-card {
            background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 1.4rem 1.6rem; box-shadow: 0 2px 10px rgba(20, 24, 50, 0.04);
            transition: box-shadow .2s, transform .2s;
        }
        .xp-card:hover { box-shadow: 0 8px 24px rgba(20, 24, 50, 0.08); transform: translateY(-2px); }
        .xp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.25rem 1rem; }
        .xp-head h3 { margin: 0; font-size: 1.3rem; color: var(--ink); }
        .xp-date {
            font-size: 0.85rem; font-weight: 600; color: var(--accent);
            background: var(--accent-soft); border-radius: 999px; padding: 0.15rem 0.7rem; white-space: nowrap;
        }
        .xp-org { color: var(--muted); font-weight: 600; margin: 0.3rem 0 0.8rem; }
        .xp-org i { margin-right: 0.3rem; }
        .xp-card ul { margin-bottom: 0.9rem; padding-left: 1.2rem; }
        .xp-card li { margin-bottom: 0.35rem; }
        .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .tag {
            font-size: 0.78rem; font-weight: 600; color: var(--ink);
            border: 1px solid var(--line); border-radius: 6px; padding: 0.15rem 0.55rem; background: #f7f8fc;
        }

        /* Media inside cards */
        .media-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
        .media-item { flex: 1 1 260px; }
        .media-item img, .media-item video { width: 100%; border-radius: 8px; display: block; }
        .media-caption { font-size: 0.82rem; color: var(--muted); margin-top: 0.35rem; }

        /* Projects as a card grid */
        .proj-grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; margin-top: 1.5rem; }
        .proj-grid .xp-card h3 { font-size: 1.15rem; margin-bottom: 0; }
        .proj-grid .xp-head { margin-bottom: 0.7rem; }
        .proj-grid .xp-card.wide { grid-column: 1 / -1; }
        .gallery { display: flex; gap: 0.75rem; margin-top: 1.2rem; align-items: flex-start; }
        .gallery figure { min-width: 0; }
        @media (max-width: 768px) { .gallery { flex-direction: column; } .gallery figure { flex: none !important; width: 100%; } }
        .gallery figure { margin: 0; }
        .proj-grid .gallery img { width: 100%; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #000; }
        .gallery a { display: block; }
        .proj-grid figure { margin: 0.8rem 0 0; }
        .proj-grid figure img { width: 100%; max-width: 520px; border-radius: 8px; }
        .proj-grid figcaption { font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; }

        @media (max-width: 576px) {
            .xp-card { padding: 1.1rem 1.1rem; }
            .timeline { padding-left: 1.4rem; }
            .xp::before { left: -1.4rem; }
        }
    </style>

    <script id="experience-source" type="text/plain">
<div class="timeline">
<div class="xp"><div class="xp-card">
<div class="xp-head"><h3>Hardware Digital Design Intern</h3><span class="xp-date">May 2026 – Present</span></div>
<div class="xp-org"><i class="bi bi-building"></i>Ericsson Canada</div>
<ul>
<li>Designed, updated and validated schematics for telecom radio platforms.</li>
<li>Benchmarked clock synthesizer ICs on phase jitter performance at 491.52 MHz.</li>
<li>Performed power rail analysis on PCB layout in Cadence, covering current density and load transients to meet PDN margins.</li>
<li>Developed PRBS loopback on the JESD204C link between RFIC and FPGA, and tuned SerDes transceiver parameters through eye-diagram analysis to minimize bit error rate.</li>
</ul>
<div class="tags"><span class="tag">DCDC POL Layout</span><span class="tag">Schematic design</span><span class="tag">Close-in Phase Noise</span><span class="tag">PDN analysis</span><span class="tag">Cadence Allegro</span></div>
</div></div>
<div class="xp"><div class="xp-card">
<div class="xp-head"><h3>Hardware Member</h3><span class="xp-date">Sept 2024 – Present</span></div>
<div class="xp-org"><i class="bi bi-cpu"></i>University of Toronto RoboSoccer</div>
<ul>
<li>Architected the PCB of a humanoid robotics system for power delivery and command/data telemetry.</li>
<li>Designed the power tree from a 24–48 V battery input to peripheral rails, using buck-converter POLs, LDOs and kill-switch functionality, for 20+ QDD actuators drawing up to 600 W peak.</li>
<li>Configured CAN 2.0A/B for motor actuation, SPI for high-speed master–slave MCU synchronization, I²C for real-time IMU data acquisition, and UART for debugging.</li>
</ul>
<div class="media-row">
<div class="media-item">
<a href="https://www.youtube.com/watch?v=bINm34lQ1Jg&t=6s" target="_blank" rel="noopener noreferrer"><img src="https://img.youtube.com/vi/bINm34lQ1Jg/maxresdefault.jpg" alt="2025 RoboCup qualifying video"></a>
<div class="media-caption">2025 RoboCup qualifying video (opens on YouTube)</div>
<a href="static/assets/img/rbnew.jpg" target="_blank" rel="noopener noreferrer" style="display:block;margin-top:1rem"><img src="static/assets/img/rbnew.jpg" alt="Bare RoboSoccer power and communication PCB"></a>
<div class="media-caption">Robot power and communication board, first fab</div>
</div>
<div class="media-item">
<video controls poster="static/assets/img/roboleg-thumb.jpg"><source src="static/assets/video/roboleg.mp4" type="video/mp4">Your browser does not support the video tag.</video>
<div class="media-caption">2026 leg demonstration</div>

</div>
<ul>
<li><b>WindBorne</b>: Powering 24 Direct Drive motors is dangrous, espeically when considering their peak power consumption (4000W+). Even with trained RL policies and firmware limits, the system remains challenging to manage safely.
    which is why an additional layer of pure analog clamping is implemented. Voltage read from a current sense resistor is compared to a solid 2.5V reference. When Vsense exceeds the reference, monitor IC trigers FET driver to enter
    a skip state which forces 4 Power FETs into linear mode, effectively clamping the current while sending a signal to the MCU for motor shutdowon. While long linear mode operation stresses the FETs, a completely shutoff is enforced
    if condition remains for more than 5 ms, set by a RC timer.

</li>
</ul>

</div>

<div class="proj-grid">
<div class="xp-card wide">
<div class="xp-head"><h3>SPI-to-4-CAN SoC</h3><span class="xp-date">Sept 2026</span></div>
<ul>
<li><i><p style="font-family:'Courier New'">Why? this will serve as an alternative to having control SPI-to-CAN transievers, like the Microchip MCP2515 which is quite pin demanding on the SPI Master and require additional components. </p></i></li>
<li>Designed a custom SPI-to-CAN bridge SoC on a Lattice MachXO2 FPGA, built around a Wishbone bus controller, fanning one SPI host out to four 4 channels.</li>
<li>Described asynchronous FIFO buffers and robust CDC synchronizers in Verilog to manage high-throughput data transfer between clock domains.</li>
</ul>
<div class="tags"><span class="tag">Verilog HDL</span><span class="tag">Lattice MachXO2</span><span class="tag">Wishbone</span><span class="tag">Async FIFO</span><span class="tag">CDC</span><span class="tag">SPI</span><span class="tag">CAN</span></div>
